<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPIT-405 | Lab 6: Like, Dislike & Comments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Lab 6: Interactive Feedback</h1>
        <p class="subtitle">Vote and leave your comment below</p>

        <!-- Like & Dislike Buttons Section -->
        <div class="vote-section">
            <button id="likeBtn" class="vote-btn like">
                👍 <span id="likeCount">100</span>
            </button>
            <button id="dislikeBtn" class="vote-btn dislike">
                👎 <span id="dislikeCount">20</span>
            </button>
        </div>

        <p id="voteStatus" class="status-msg"></p>

        <!-- Comments Form Section -->
        <div class="comment-section">
            <h3>Comments</h3>
            <div class="input-group">
                <input type="text" id="commentInput" placeholder="Write a comment...">
                <button id="submitBtn" class="action-btn submit">Submit</button>
            </div>
            
            <!-- Display Comments -->
            <ul id="commentsList" class="comments-list"></ul>
        </div>

        <!-- Reset Button -->
        <div class="reset-section">
            <button id="resetBtn" class="action-btn clear">Clear / Reset All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
